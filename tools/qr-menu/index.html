<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free QR Menu Generator · levantline</title>
<meta name="description" content="Free QR code generator for restaurant menus. Paste your menu or WhatsApp link, download a clean PNG. Runs in your browser, nothing is uploaded.">
<link rel="icon" href="../../img/logo.png">
<style>
:root{--cream:#F7F1E6;--ink:#1F2A33;--teal:#1F6F6B;--olive:#3E5C2F;--gold:#E9A23B;--panel:#fff;--line:#e5dccb;--muted:#4b5560}
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}
.wrap{max-width:920px;margin:auto;padding:0 22px}
nav{display:flex;align-items:center;gap:12px;padding:22px 0}nav img{width:44px;border-radius:50%}nav a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:12px}nav b{font-size:22px;letter-spacing:-.5px}
.sp{margin-inline-start:auto;display:flex;gap:8px}
.tbtn{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:8px 13px;font-size:16px;cursor:pointer;font-family:inherit}
h1{font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-1.5px;margin-top:26px}h1 span{color:var(--teal)}
.lead{font-size:18px;color:var(--muted);max-width:560px;margin-top:12px}
.tool{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px;margin:30px 0}
.panel{background:var(--panel);border-radius:20px;padding:22px;box-shadow:0 10px 30px -12px rgba(31,42,51,.25);display:flex;flex-direction:column;gap:14px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
input[type=text],input[type=url]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:transparent;color:inherit}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.sw{display:flex;gap:10px}.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;outline:1px solid var(--line)}.sw button[aria-pressed=true]{border-color:var(--panel);outline:3px solid var(--teal)}
.btn{display:inline-block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;padding:13px 18px;border-radius:12px;font-weight:700;border:0;font-size:16px;cursor:pointer;font-family:inherit}
.btn.alt{background:var(--olive)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.preview{align-items:center;justify-content:center;text-align:center}
#out{width:100%;max-width:340px;border-radius:14px;border:1px solid var(--line);background:#fff;display:none}
#empty{color:var(--muted);padding:60px 10px}
#err{color:#b3261e;font-size:14px;min-height:20px}
.cta{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin:10px 0 40px}
.cta .panel p{color:var(--muted)}.cta h2{font-size:20px}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:#7a7f86;font-size:14px}
[data-theme=dark]{--cream:#0F0E0C;--ink:#F3EBDD;--teal:#D4A853;--olive:#D4A853;--gold:#D4A853;--panel:#1A1815;--line:#2C2924;--muted:#A79C8B}
[data-theme=dark] body{background:radial-gradient(900px 500px at 50% -10%,rgba(212,168,83,.15),transparent 60%),#0F0E0C}
[data-theme=dark] .btn{background:#D4A853;color:#0F0E0C}
[data-theme=dark] .btn.alt{background:transparent;border:1px solid #D4A853;color:#D4A853}
[data-theme=dark] .panel{box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
[data-theme=dark] #err{color:#ff8a80}
</style></head><body>
<div class="wrap">
<nav><a href="../../"><img src="../../img/logo.png" alt=""><b>levantline</b></a>
<div class="sp"><button class="tbtn" id="lbtn" aria-label="Language">عربي</button><button class="tbtn" id="tbtn" aria-label="Switch light/dark">🌙</button></div></nav>

<p class="lead" id="lead"></p>
<section class="tool">
<div class="panel">

<div><label id="l_col"></label><div class="sw" id="sw"></div></div>

<button class="btn" id="go"></button>
</div>
<div class="panel preview">
<div id="empty"></div>
<img id="out" alt="QR code">
<button class="btn" id="dl" disabled></button>
<div class="hint" id="h_dl"></div>
</div>
</section>

<div class="panel"><h2 id="c2t"></h2><p id="c2p"></p><a class="btn alt" id="c2b" href="https://www.fiverr.com/s/jyeear9"></a></div>
</section>

const T={en:{h1:'Free QR code for <span>your menu.</span>',lead:'Paste your menu or WhatsApp link, get a clean QR code to print. Runs in your browser, nothing is uploaded.',biz:'Business name',url:'Menu, website or WhatsApp link',hurl:'Example: https://wa.me/962791234567 or your menu page.',col:'Colour',go:'Make QR code',dl:'Download PNG',hdl:'High resolution, ready to print. On iPhone you can also press and hold the image to save it.',empty:'Your QR code will appear here.',scan:'Scan for our menu',e1:'Enter a link first.',e2:'That link looks wrong. Start with https:// or wa.me/.',e3:'Link is too long for a QR code. Use a shorter one.',c1t:'Want a full menu page behind the QR?',c1p:'Mobile menu website with WhatsApp ordering, English + Arabic, light/dark. Edit one block and publish free.',c1b:'Get the template',c2t:'Prefer it done for you?',c2p:'I build your menu website and set up the QR, with WhatsApp ordering included.',c2b:'Hire me on Fiverr',foot:'© 2026 levantline · Amman, Jordan · QR Code is a registered trademark of DENSO WAVE INCORPORATED.',name:'Your Cafe'},
ar:{h1:'رمز QR مجاني <span>لقائمتك.</span>',lead:'الصق رابط القائمة أو الواتساب واحصل على رمز QR جاهز للطباعة. يعمل داخل المتصفح ولا يتم رفع أي شيء.',biz:'اسم المطعم أو المحل',url:'رابط القائمة أو الموقع أو الواتساب',hurl:'مثال: https://wa.me/962791234567 أو رابط صفحة القائمة.',col:'اللون',go:'أنشئ الرمز',dl:'تحميل PNG',hdl:'دقة عالية وجاهز للطباعة. على الآيفون يمكنك أيضاً الضغط مطولاً على الصورة لحفظها.',empty:'سيظهر رمز QR هنا.',scan:'امسح الرمز لعرض القائمة',e1:'أدخل رابطاً أولاً.',e2:'الرابط غير صحيح. ابدأ بـ https:// أو wa.me/.',e3:'الرابط طويل جداً لرمز QR. استخدم رابطاً أقصر.',c1t:'تريد صفحة قائمة كاملة خلف الرمز؟',c1p:'موقع قائمة للجوال مع طلبات واتساب، عربي وإنجليزي، فاتح وداكن. عدّل ملفاً واحداً وانشره مجاناً.',c1b:'احصل على القالب',c2t:'تفضل أن أنفذها لك؟',c2p:'أبني موقع القائمة وأجهز الرمز مع الطلب عبر واتساب.',c2b:'وظّفني على Fiverr',foot:'© 2026 levantline · عمّان، الأردن · QR Code علامة مسجلة لشركة DENSO WAVE INCORPORATED.',name:'مقهاك'}};
const COLS=['#1F2A33','#1F6F6B','#3E5C2F','#7A3E1D'];
let L='en',col=COLS[0],last=null;
const $=i=>document.getElementById(i),r=document.documentElement;
const sw=$('sw');COLS.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label',c);b.setAttribute('aria-pressed',i==0);b.onclick=()=>{col=c;[...sw.children].forEach(x=>x.setAttribute('aria-pressed',x===b));if(last)make()};sw.appendChild(b)});
function apply(){const t=T[L];r.lang=L;r.dir=L=='ar'?'rtl':'ltr';
$('h1').innerHTML=t.h1;$('lead').textContent=t.lead;$('l_biz').textContent=t.biz;$('l_url').textContent=t.url;$('h_url').textContent=t.hurl;$('l_col').textContent=t.col;$('go').textContent=t.go;$('dl').textContent=t.dl;$('h_dl').textContent=t.hdl;$('empty').textContent=t.empty;
$('biz').placeholder=t.name;$('lbtn').textContent=L=='en'?'عربي':'EN';
['c1t','c1p','c1b','c2t','c2p','c2b'].forEach(k=>$(k).textContent=t[k]);$('foot').textContent=t.foot;$('err').textContent='';
if(last)make()}
function normalize(v){v=v.trim();if(!v)return null;if(/^(wa\.me|api\.whatsapp\.com)\//i.test(v))v='https://'+v;else if(!/^[a-z][a-z0-9+.-]*:/i.test(v)&&/^[^\s]+\.[^\s]{2,}/.test(v))v='https://'+v;
try{const u=new URL(v);if(!/^https?:$/.test(u.protocol))return 0;return encodeURI(decodeURI(u.href))}catch(e){return 0}}
function rrect(c,x,y,w,h,rad){c.beginPath();c.moveTo(x+rad,y);c.arcTo(x+w,y,x+w,y+h,rad);c.arcTo(x+w,y+h,x,y+h,rad);c.arcTo(x,y+h,x,y,rad);c.arcTo(x,y,x+w,y,rad);c.closePath()}
function make(){const t=T[L],e=$('err');e.textContent='';const n=normalize($('url').value);
if(n===null){e.textContent=t.e1;return}if(n===0){e.textContent=t.e2;return}
let q;try{q=qrcode(0,'Q');q.addData(n,'Byte');q.make()}catch(x){e.textContent=t.e3;return}
const m=q.getModuleCount(),W=1200,pad=90,qs=W-pad*2,cell=Math.floor(qs/m),qsz=cell*m,qx=Math.round((W-qsz)/2),name=$('biz').value.trim(),H=pad+qsz+(name?330:210);
const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
c.fillStyle='#fff';c.fillRect(0,0,W,H);
c.fillStyle=col;for(let y=0;y<m;y++)for(let x=0;x<m;x++)if(q.isDark(y,x))c.fillRect(qx+x*cell,pad+y*cell,cell,cell);
c.textAlign='center';c.direction=L=='ar'?'rtl':'ltr';c.fillStyle=col;let y0=pad+qsz+110;
if(name){c.font='700 84px system-ui,-apple-system,Tahoma,sans-serif';let s=84;while(c.measureText(name).width>W-140&&s>36){s-=4;c.font='700 '+s+'px system-ui,-apple-system,Tahoma,sans-serif'}c.fillText(name,W/2,y0);y0+=100}
c.fillStyle='#555';c.font='500 48px system-ui,-apple-system,Tahoma,sans-serif';c.fillText(t.scan,W/2,y0);
last=cv.toDataURL('image/png');const o=$('out');o.src=last;o.style.display='block';$('empty').style.display='none';$('dl').disabled=false}
$('go').onclick=make;$('url').addEventListener('keydown',e=>{if(e.key=='Enter')make()});
$('dl').onclick=()=>{if(!last)return;const a=document.createElement('a');a.href=last;a.download=(($('biz').value.trim()||'menu').replace(/[^\w؀-ۿ-]+/g,'-'))+'-qr.png';document.body.appendChild(a);a.click();a.remove()};
$('lbtn').onclick=()=>{L=L=='en'?'ar':'en';try{localStorage.setItem('lv-lang',L)}catch(e){}apply()};
const tb=$('tbtn');function icon(){tb.textContent=r.dataset.theme==='dark'?'☀️':'🌙'}
try{const v=localStorage.getItem('lv-theme');if(v)r.dataset.theme=v;const l=localStorage.getItem('lv-lang');if(l&&T[l])L=l}catch(e){}
icon();tb.onclick=()=>{r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';icon();try{localStorage.setItem('lv-theme',r.dataset.theme)}catch(e){}};
apply();
</script>
</body></html>
