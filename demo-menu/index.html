<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olive & Ember Café · Menu</title>
<!-- Restaurant Menu Template v1.0 by levantline
     Changelog: v1.0 first release · EN/AR toggle · WhatsApp ordering · cart total
     EDIT ONLY THE "CAFE" BLOCK BELOW. -->
<style>
:root{--bg:#FBF7F0;--ink:#22201C;--muted:#7A736A;--accent:#B4532A;--card:#fff;--line:#EDE5D8}
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
[dir=rtl] body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
header{padding:28px 20px 18px;text-align:center}
.logo{width:68px;height:68px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font:800 26px Inter}
h1{font-size:28px;letter-spacing:-.5px}.tag{color:var(--muted);margin-top:4px}
.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.meta a,.meta span{font-size:13px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.lang{position:absolute;top:16px;right:16px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:700;cursor:pointer}
[dir=rtl] .lang{right:auto;left:16px}
nav{position:sticky;top:0;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);z-index:5}
nav a{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
main{max-width:640px;margin:auto;padding:8px 16px 120px}
h2{font-size:20px;margin:26px 0 12px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.item .t{flex:1}.item b{display:block}.item small{color:var(--muted)}
.price{font-weight:800;color:var(--accent);white-space:nowrap}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px;background:var(--card);border-top:1px solid var(--line);display:none}
.bar a{display:block;max-width:640px;margin:auto;text-align:center;background:#1FA855;color:#fff;font-weight:800;padding:15px;border-radius:14px;text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
</style></head><body>
<button class="lang" id="lang">عربي</button>
<header><div class="logo" id="logo"></div><h1 id="name"></h1><p class="tag" id="tagline"></p><div class="meta" id="meta"></div></header>
<nav id="nav"></nav><main id="menu"></main>
<div class="bar" id="bar"><a id="order" target="_blank"></a></div>
<footer>Demo menu · template by levantline</footer>
<script>
/* ===== CAFE: edit everything here ===== */
const CAFE={
 name:{en:"Olive & Ember Café",ar:"مقهى زيتون وجمر"},
 tagline:{en:"Coffee, bakes & breakfast",ar:"قهوة، مخبوزات وفطور"},
 logo:"O&E",
 whatsapp:"15555550123",            // number with country code, no + or spaces
 currency:"$",
 hours:{en:"Daily 8:00–22:00",ar:"يومياً ٨:٠٠–٢٢:٠٠"},
 mapLink:"https://maps.google.com",
 sections:[
  {title:{en:"Coffee",ar:"قهوة"},items:[
   {n:{en:"Arabic Coffee",ar:"قهوة عربية"},d:{en:"Cardamom, served in finjan",ar:"بالهيل، بالفنجان"},p:3},
   {n:{en:"Flat White",ar:"فلات وايت"},d:{en:"Double shot, steamed milk",ar:"شوت مزدوج وحليب"},p:4.5},
   {n:{en:"Iced Spanish Latte",ar:"سبانش لاتيه مثلج"},d:{en:"Condensed milk, espresso",ar:"حليب مكثف وإسبريسو"},p:5}]},
  {title:{en:"Breakfast",ar:"فطور"},items:[
   {n:{en:"Za'atar Manakish",ar:"مناقيش زعتر"},d:{en:"Fresh from the oven",ar:"طازة من الفرن"},p:3.5},
   {n:{en:"Shakshuka",ar:"شكشوكة"},d:{en:"Eggs, tomato, bread",ar:"بيض، بندورة، خبز"},p:7},
   {n:{en:"Halloumi Plate",ar:"صحن حلوم"},d:{en:"Grilled, olives, cucumber",ar:"مشوي، زيتون، خيار"},p:8}]},
  {title:{en:"Sweets",ar:"حلويات"},items:[
   {n:{en:"Knafeh",ar:"كنافة"},d:{en:"Warm, with cheese",ar:"سخنة بالجبنة"},p:6},
   {n:{en:"Maamoul (3)",ar:"معمول (٣)"},d:{en:"Date-filled",ar:"بالتمر"},p:4}]}]
};
/* ===== end of edit area ===== */
let L="en";const cart={};
const $=id=>document.getElementById(id);
function render(){
 document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 $("lang").textContent=L==="en"?"عربي":"English";
 $("logo").textContent=CAFE.logo;$("name").textContent=CAFE.name[L];$("tagline").textContent=CAFE.tagline[L];
 $("meta").innerHTML=`<span>🕒 ${CAFE.hours[L]}</span><a href="${CAFE.mapLink}" target="_blank">📍 ${L==="en"?"Map":"الموقع"}</a><a href="https://wa.me/${CAFE.whatsapp}" target="_blank">💬 WhatsApp</a>`;
 $("nav").innerHTML=CAFE.sections.map((s,i)=>`<a href="#s${i}">${s.title[L]}</a>`).join("");
 $("menu").innerHTML=CAFE.sections.map((s,i)=>`<h2 id="s${i}">${s.title[L]}</h2>`+s.items.map((it,j)=>{const k=i+"-"+j;return`<div class="item"><div class="t"><b>${it.n[L]}</b><small>${it.d[L]}</small></div><span class="price">${CAFE.currency}${it.p}</span><div class="qty"><button onclick="q('${k}',-1)">−</button><span>${cart[k]||0}</span><button onclick="q('${k}',1)">+</button></div></div>`}).join("")).join("");
 bar();}
function q(k,d){cart[k]=Math.max(0,(cart[k]||0)+d);render()}
function bar(){let lines=[],tot=0;for(const k in cart){if(!cart[k])continue;const[i,j]=k.split("-");const it=CAFE.sections[i].items[j];tot+=it.p*cart[k];lines.push(`${cart[k]} x ${it.n[L]}`)}
 $("bar").style.display=lines.length?"block":"none";
 const msg=(L==="en"?"Hi! I'd like to order:\n":"مرحبا! بدي أطلب:\n")+lines.join("\n")+`\n${L==="en"?"Total":"المجموع"}: ${CAFE.currency}${tot.toFixed(2)}`;
 $("order").href=`https://wa.me/${CAFE.whatsapp}?text=${encodeURIComponent(msg)}`;
 $("order").textContent=(L==="en"?"Order on WhatsApp · ":"اطلب عبر واتساب · ")+CAFE.currency+tot.toFixed(2);}
$("lang").onclick=()=>{L=L==="en"?"ar":"en";render()};render();
</script></body></html>
